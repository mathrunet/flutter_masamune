name: masamune_logger_firebase
description: Plug-in package to easily add Firebase Analytics, Performance and
  Crashlytics on Masamune Framework. The functionality is available by simply
  adding an Adapter.
version: 3.4.0
homepage: https://mathru.net
repository: https://github.com/mathrunet/flutter_masamune/tree/master/packages/masamune_logger_firebase

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter

  masamune: ^3.6.1
  katana_firebase: ^3.4.0
  firebase_core: ^5.1.0
  firebase_crashlytics: ^6.0.1
  firebase_analytics: ^13.0.1
  firebase_performance: ^0.12.1

dev_dependencies:
  test: ^1.25.0
  katana_test: ^3.1.1
  flutter_lints: ^6.0.0
  import_sorter: ^4.6.0
