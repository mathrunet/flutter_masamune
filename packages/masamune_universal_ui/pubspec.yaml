name: masamune_universal_ui
description: The package provide a universal UI that aims to be written in one
  code on any platform.
version: 3.4.1
homepage: https://mathru.net
repository: https://github.com/mathrunet/flutter_masamune/tree/master/packages/masamune_universal_ui

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter

  katana: ^3.5.0
  masamune: ^3.6.2
  url_launcher: ^6.3.1
  shimmer: ^3.0.0
  ios_window_control_layout: ^0.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.0
  katana_test: ^3.1.1
  flutter_lints: ^6.0.0
  import_sorter: ^4.6.0
  plugin_platform_interface: ^2.0.2
