name: katana_storage_firebase
description: Firebase plugin for katana_storage. A package to facilitate
  switching between Local and Firebase storage implementations.
version: 3.2.1
homepage: https://mathru.net
repository: https://github.com/mathrunet/flutter_masamune/tree/master/packages/katana_storage_firebase

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter

  katana: ^3.5.0
  katana_storage: ^3.2.0
  katana_firebase: ^3.3.0
  firebase_core: ^5.1.0
  firebase_storage: ^14.0.1
  path_provider: ^2.1.3
  katana_platform_info: ^3.3.0

dev_dependencies:
  test: ^1.25.0
  katana_test: ^3.1.1
  flutter_lints: ^6.0.0
  import_sorter: ^4.6.0
