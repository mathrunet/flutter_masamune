name: masamune_experiment
description: Plug-in for Masamune that defines A/B tests and feature switches
  in a single synchronous function based on Firebase Remote Config values.
version: 3.0.0
homepage: https://mathru.net
repository: https://github.com/mathrunet/flutter_masamune/tree/master/packages/masamune_experiment

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

  meta:
  katana: ^3.5.0
  masamune: ^3.6.0
  masamune_model_firebase_remote_config: ^3.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.0
  katana_test: ^3.1.1
  flutter_lints: ^6.0.0
  import_sorter: ^4.6.0
