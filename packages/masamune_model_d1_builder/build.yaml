builders:
  masamune_model_d1_builder:
    import: "package:masamune_model_d1_builder/masamune_model_d1_builder.dart"
    builder_factories: ["masamuneModelD1BuilderFactory"]
    build_extensions: {".dart": [".d1_schema"]}
    auto_apply: all_packages
    build_to: source
    applies_builders: ["source_gen|combining_builder"]

targets:
  $default:
    builders:
      masamune_model_d1_builder:
        enabled: true
        generate_for:
          exclude:
            - test
            - example
            - ios
            - android
            - windows
            - macos
            - linux
            - web
